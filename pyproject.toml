[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaduha-ovp"
version = "0.1.0"
description = "Owens Valley Paiute language package for the Yaduha framework"
requires-python = ">=3.10"
dependencies = [
    "yaduha>=0.3.4",
]

[project.entry-points."yaduha.languages"]
ovp = "yaduha_ovp:language"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "openai",
    "python-dotenv",
    "requests",
]
experiments = [
    "sacrebleu>=2.0",
    "unbabel-comet>=2.0",
    "pandas",
    "tqdm",
    "matplotlib",
    "seaborn",
]
training = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "peft>=0.19.1",
    "trl>=1.2.0",
]

[tool.uv.sources]
yaduha = { path = "../yaduha", editable = true }
